[project]
name = "doc-analyzer"
version = "0.1.0"
description = "ATHRag 文档解析器 — 独立 CLI 工具，将文档文件解析为标准化 JSON"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ATHRag Team"}
]

dependencies = [
    # Core
    "pyyaml>=6.0",
    "pydantic>=2.0",

    # PDF
    "pypdf>=5.1.0",

    # Office (native fallback)
    "python-docx>=1.1.2",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",

    # Image OCR
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",

    # Text processing
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
]

[project.optional-dependencies]
# Office 解析增强（Unstructured）
office = [
    "unstructured[docx,xlsx,pptx]>=0.16.0",
]

# PDF 解析增强（MinerU）
pdf-advanced = [
    # MinerU 需要单独的 Python 3.11 环境
    # 通过 scripts/mineru.sh 调用
]

# 代码注释提取
code = []

# 全部可选依赖
all = [
    "unstructured[docx,xlsx,pptx]>=0.16.0",
]

[project.scripts]
doc-analyze = "doc_analyzer.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
